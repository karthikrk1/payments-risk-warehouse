# Repo-local dbt profile. No credentials: DuckDB is a local file.
# dbt finds this file when run from the risk_warehouse/ directory, so no ~/.dbt setup is needed.
#
# WAREHOUSE_PATH overrides the file for either target. The Prefect flow sets it (to an absolute
# path) so replay builds its own warehouse and never touches these defaults. Unset, paths are
# relative to risk_warehouse/, where dbt is run from.
risk_warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '../warehouse/risk.duckdb') }}"
      threads: 4
    # Built from the committed sample by `make ci-build` (and in CI). Separate file, so it never
    # touches the full dev warehouse.
    ci:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '../warehouse/ci.duckdb') }}"
      threads: 4

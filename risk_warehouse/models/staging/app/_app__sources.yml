sources:
  - name: app
    description: >
      Synthetic accounts, devices, logins and disputes generated by
      ingestion/generate_entities.py around the PaySim transactions (fixed seed, reproducible).
      Logins and devices carry a deliberately planted fraud signal; see the README.
    schema: raw
    tables:
      - name: app_accounts
        description: One row per customer account seen in PaySim.
      - name: app_devices
        description: One row per device seen in a login.
      - name: app_logins
        description: >
          One row per login attempt: a successful login before each sending transaction, plus
          any failed attempts before it.
      - name: app_disputes
        description: One row per disputed transaction, filed by the sender after the transaction.

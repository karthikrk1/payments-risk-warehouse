name: 'risk_warehouse'
version: '1.0.0'

profile: 'risk_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # PaySim `step` is an hour index with no real date attached. transaction_ts is derived as
  # paysim_start_date + (step - 1) hours. The anchor date is arbitrary but fixed so that output
  # is reproducible.
  paysim_start_date: '2024-01-01'
  # dim_date covers the earliest account signup (2021-01-01, up to 3 years before activity) to
  # past the last dispute (filed up to 14 days after the window). End is exclusive. Relationship
  # tests from every fact date to dim_date fail if data falls outside this range.
  dim_date_start: '2021-01-01'
  dim_date_end: '2024-03-01'
  # Monitoring (models/monitoring/): each day is compared with the previous `baseline_days` days,
  # needs at least `min_baseline_days` of them, and is an anomaly when its modified z-score
  # (Iglewicz & Hoaglin) exceeds `anomaly_threshold`. 3.5 is the published rule, not a value tuned
  # to PaySim.
  monitoring_baseline_days: 7
  monitoring_min_baseline_days: 5
  monitoring_anomaly_threshold: 3.5
  # ...and is at least this far from the baseline median, relative to it. On millions of rows
  # daily metrics are so stable that MAD is tiny and trivial moves (5.71% -> 5.77%) score as extreme;
  # this keeps only material changes. On the full data: 0% -> 65 flags, 10% -> 59, 20% -> 52,
  # 25-30% -> 51, i.e. above ~20% the remaining flags are all large.
  monitoring_min_relative_change: 0.2

seeds:
  risk_warehouse:
    +schema: seeds
    transaction_types:
      +column_types:
        transaction_type: varchar
        transaction_type_label: varchar
        sender_direction: varchar
        receiver_kind: varchar
        description: varchar
    known_events:
      +column_types:
        event_id: varchar
        source: varchar
        metric_name: varchar
        start_date: date
        end_date: date
        description: varchar

models:
  risk_warehouse:
    # Staging: 1:1 with raw sources, rename/cast/clean only. Views keep them cheap.
    staging:
      +schema: staging
      +materialized: view
    # Intermediate: joins and risk features. Not consumed directly by analysts.
    intermediate:
      +schema: intermediate
      +materialized: view
    # Marts: tables for analytics (star schema) and ML.
    marts:
      +materialized: table
      core:
        +schema: core
      ml:
        +schema: ml
    # Daily data-quality metrics and anomaly scores, computed from the data itself.
    monitoring:
      +schema: monitoring
      +materialized: table

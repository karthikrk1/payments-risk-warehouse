# Weekly pull requests for outdated GitHub Actions and Python packages.
# They go through the same CI checks as any other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements.txt pins dbt's whole dependency tree, and those versions follow dbt (bumping
    # them one by one breaks dbt's own constraints). Only update what this project uses directly.
    # dbt-core and dbt-duckdb move together; update them by hand.
    allow:
      - dependency-name: duckdb
      - dependency-name: pyyaml
      - dependency-name: ruff

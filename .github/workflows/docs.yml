name: Docs

# Publishes the dbt docs site (lineage graph, model and column docs, SQL) and the monitoring
# chart page to GitHub Pages on every merge to main:
#   https://karthikrk1.github.io/payments-risk-warehouse/            dbt docs
#   https://karthikrk1.github.io/payments-risk-warehouse/monitoring/ monitoring charts
# Built from the committed sample (data/sample/), so the catalog's row counts and statistics are
# the sample's, not the full dataset's. Everything else (models, docs, tests, lineage) is the same.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one but never cancels a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no moving `v10`), so pin the commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      # docs generate reads table and column types from a built warehouse, so build it first.
      - name: Build the sample warehouse
        run: make ci-build

      # --static writes one self-contained HTML file (manifest and catalog inlined).
      - name: Generate dbt docs
        working-directory: risk_warehouse
        run: ../.venv/bin/dbt docs generate --target ci --static

      - name: Assemble site
        run: |
          mkdir -p site
          cp risk_warehouse/target/static_index.html site/index.html

      # The monitoring chart page, built from the committed full-data export
      # (docs/monitoring/monitoring.json), not from the sample, whose rates are skewed on purpose.
      - name: Build the monitoring page
        run: .venv/bin/python scripts/build_monitoring_page.py --out site/monitoring/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
